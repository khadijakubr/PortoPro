; ============================================================================
; [RENDER-FIX 3 lanjutan] php.ini production — file BARU
; SEBELUM  : pakai php.ini default (display_errors bisa On, upload 2M).
; SESUDAH : display_errors Off (log saja), upload 8M selaras validasi JS.
; ============================================================================
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
upload_max_filesize = 8M
post_max_size = 10M
max_file_uploads = 5
memory_limit = 256M
max_execution_time = 60
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
date.timezone = "Asia/Jakarta"
